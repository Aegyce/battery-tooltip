name: Test and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare portable compiler
        shell: pwsh
        run: ./tools/bootstrap.ps1
      - name: Test formatting and edge cases
        shell: pwsh
        run: python tools/test.py
      - name: Compile mod
        shell: pwsh
        run: python tools/build.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/package/Precompiled -Force | Out-Null
          Copy-Item battery-tooltip.wh.cpp,README.md,LICENSE,VERSION,Setup.cmd,Start.cmd,Rollback.cmd artifacts/package
          Copy-Item tools artifacts/package/tools -Recurse
          Copy-Item tests artifacts/package/tests -Recurse
          Copy-Item runtime/windhawk/AppData/Engine/Mods/64/battery-tooltip*.dll artifacts/package/Precompiled
          $version = (Get-Content VERSION -Raw).Trim()
          Compress-Archive -Path artifacts/package/* -DestinationPath "artifacts/BatteryTooltip-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryTooltip
          path: artifacts/BatteryTooltip-*.zip
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and VERSION must match.' }
          $archives = @(Get-ChildItem artifacts/BatteryTooltip-*.zip | ForEach-Object { $_.FullName })
          gh release create "$env:GITHUB_REF_NAME" @archives --title "$env:GITHUB_REF_NAME" --generate-notes
