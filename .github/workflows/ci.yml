name: Test and release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare portable compiler
        shell: pwsh
        run: ./tools/bootstrap.ps1
      - name: Test formatting and edge cases
        shell: pwsh
        run: python tools/test.py
      - name: Test configuration writes and recovery
        shell: powershell
        run: ./tests/ConfigTests.ps1
      - name: Test startup ownership and precompiled installation
        shell: powershell
        run: ./tests/InstallTests.ps1
      - name: Compile mod
        shell: pwsh
        run: python tools/build.py
      - name: Package
        shell: pwsh
        run: ./tools/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryTooltip
          path: |
            artifacts/BatteryTooltip-*.zip
            artifacts/battery-tooltip.wh.cpp
            artifacts/SHA256SUMS.txt
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and VERSION must match.' }
          $archives = @(Get-ChildItem artifacts/BatteryTooltip-*.zip | ForEach-Object { $_.FullName })
          $assets = $archives + @('artifacts/battery-tooltip.wh.cpp', 'artifacts/SHA256SUMS.txt')
          $notesPath = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (Test-Path -LiteralPath $notesPath) {
            gh release create "$env:GITHUB_REF_NAME" @assets --title "$env:GITHUB_REF_NAME" --notes-file "$notesPath"
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets --title "$env:GITHUB_REF_NAME" --generate-notes
          }
